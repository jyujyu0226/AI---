const lines = []; let pass = 0, fail = 0;
function check(name, cond, detail) {
  if (cond) pass++; else fail++;
  lines.push(`${cond ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`);
}
function load(path) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("GET", path); x.responseType = "arraybuffer";
    x.onload = () => (x.status === 0 || x.status === 200) && x.response ? res(x.response) : rej(new Error("load " + path));
    x.onerror = () => rej(new Error("load " + path));
    x.send();
  });
}
function analyzeFile(buf) {
  const p = L.parseFile(buf);
  return { p, r: L.analyze(p.txns, INCOME) };
}

  check("재현 케이스: 쪼개진 금액 복구", p.txns.map((t) => t.amount).join() === "12500,23000,31000", p.txns.map((t) => t.amount).join());

  const allEtc = L.analyze([{ date: "2026-10-01", merchant: "가게A", amount: 300000, category: "기타", method: "카드" },
    { date: "2026-10-02", merchant: "가게B", amount: 50000, category: "기타", method: "카드" }], INCOME);
  check("전부 기타 → '0%가 식비' 문장 없음", !/0%가 '/.test(allEtc.text.typeLine) && /분류하지 못했어요/.test(allEtc.text.typeLine), allEtc.text.typeLine);
  const dom = L.analyze(L.reclassify([{ date: "2026-10-01", merchant: "김밥천국", amount: 9000, method: "카드" }, { date: "2026-10-02", merchant: "김밥천국", amount: 8000, method: "카드" }, { date: "2026-10-03", merchant: "GS25", amount: 1000, method: "카드" }]), INCOME);
  check("한 카테고리 80% 이상 → 근거 안내", dom.dominance && dom.dominance.category === "식비" && /가맹점명에/.test(dom.dominance.why), JSON.stringify(dom.dominance));
  const pm = [];
  for (let d = 1; d <= 30; d += 3) pm.push({ date: `2026-10-${String(d).padStart(2, "0")}`, merchant: "김밥천국", amount: 5000, method: "카드" });
  pm.push({ date: "2026-11-02", merchant: "스타벅스", amount: 5000, method: "카드" }, { date: "2026-11-04", merchant: "스타벅스", amount: 5000, method: "카드" });
  const pr = L.analyze(L.reclassify(pm), INCOME);
  check("마지막 달이 며칠치뿐이면 직전 달 분석", pr.curKey === "2026-10" && pr.partialMonth && pr.partialMonth.key === "2026-11", pr.curKey + " " + JSON.stringify(pr.partialMonth));
  // 가장 많이 쓴 항목 절약법
  const mk = (list) => L.analyze(L.reclassify(list.map(([m, a, d]) => ({ date: `2026-10-${String(d).padStart(2, "0")}`, merchant: m, amount: a, method: "카드" }))), INCOME);
  const cafeR = mk([["스타벅스", 6000, 1], ["스타벅스", 6000, 3], ["메가커피", 2000, 5], ["이디야", 4000, 8], ["김밥천국", 5000, 9]]);
  check("절약법: 1위 카페 + 숫자 채움", cafeR.topTip.cat === "카페" && cafeR.topTip.tips.length === 3 && !cafeR.topTip.tips.join().includes("{") && /평균 4,500원/.test(cafeR.topTip.tips[0]), cafeR.topTip.tips[0]);
  check("절약법: 카페 예상 절약액", cafeR.topTip.action && cafeR.topTip.action.monthly > 0, JSON.stringify(cafeR.topTip.action));
  const gameR = mk([["넥슨", 30000, 2], ["스팀", 25000, 10], ["김밥천국", 5000, 9]]);
  check("절약법: 1위 게임 + 절약 규칙", gameR.topTip.cat === "게임" && gameR.topTip.action && gameR.topTip.action.monthly === 16500, JSON.stringify(gameR.topTip.action));
  const medR = mk([["OO정형외과의원", 80000, 2], ["OO약국", 12000, 2], ["김밥천국", 5000, 9]]);
  check("절약법: 1위 병원비는 줄이라고 하지 않음", medR.topTip.cat === "병원비" && medR.topTip.noCut && !medR.topTip.action, JSON.stringify(medR.topTip.action));
  check("절약 플랜에 병원비 없음", !medR.plan.items.some((i) => i.cat === "병원비"));
  // 0건/전부 환불이면 유형 판정하지 않음
  let msg = "";
  try { L.analyze([], INCOME); } catch (e) { msg = e.message; }
  check("analyze([]) → 안내 메시지, 기본 결과 없음", /분석할 수 있는 거래가 없어요/.test(msg), msg);
  msg = "";
  try { L.analyze([{ date: "2026-10-01", merchant: "무신사", amount: -5000, category: "쇼핑", method: "카드" }], INCOME); } catch (e) { msg = e.message; }
  check("환불만 있는 경우 → 안내 메시지", /분석할 수 있는 지출이 없어요/.test(msg), msg);
}

(async () => {
  lines.push("== 단위 테스트 ==");
  try { unitTests(); } catch (e) { check("unitTests", false, e.message); }
  lines.push("", "== test-data 파일 ==");
  for (const c of CASES) {
    try {
      const buf = await load(c.file);
      if (c.error) {
        let msg = "";
        try { analyzeFile(buf); } catch (e) { msg = e.message; }
        check(`${c.file}: 오류 안내`, c.error.test(msg), msg || "오류가 나지 않음");
        continue;
      }
      L.setOwnerName(c.owner || "");
      const { p, r } = analyzeFile(buf);
      L.setOwnerName("");
      const sum = p.txns.filter((t) => t.category !== L.TRANSFER).reduce((a, t) => a + t.amount, 0); // 본인 계좌 이체 제외
      check(`${c.file}: 인코딩`, p.encoding === c.enc, p.encoding);
      check(`${c.file}: 읽은 거래 ${c.read}건`, p.txns.length === c.read, `${p.txns.length}건, 건너뜀 ${p.skipped}, 환불 ${p.refunds}`);
      check(`${c.file}: 건너뜀 ${c.skipped}건`, p.skipped === c.skipped, p.skipText);
      check(`${c.file}: 취소·환불 ${c.refunds}건`, p.refunds === c.refunds);
      check(`${c.file}: 순지출 합계 ${c.total}`, sum === c.total && r.total === c.total, `거래합 ${sum}, 분석총액 ${r.total}`);
      if (c.type) check(`${c.file}: 유형`, r.type.name === c.type, r.type.name);
      else lines.push(`INFO  ${c.file}: 유형 = ${r.type.name} (소득 70만 기준, 소득 대비 ${(r.total / INCOME * 100).toFixed(0)}%)`);
      (c.extra ? c.extra(p, r) : []).forEach(([n, ok]) => check(`${c.file}: ${n}`, ok));
    } catch (e) { check(c.file, false, e.message); }
  }
  lines.push("", "== sample_csv 회귀 (README 표와 비교) ==");
  for (const [f, type] of SAMPLES) {
    try {
      const { p, r } = analyzeFile(await load("../sample_csv/" + f));
      check(`${f}`, r.type.name === type, `${r.type.name} · 거래 ${p.txns.length}건 · 건너뜀 ${p.skipped} · 환불 ${p.refunds} · 지출 ${r.total} (소득 대비 ${(r.total / INCOME * 100).toFixed(0)}%, 위험도 ${r.risk}, 자동분류 ${p.autoClassified})`);
    } catch (e) { check(f, false, e.message); }
  }
  lines.unshift(`결과: ${pass} PASS / ${fail} FAIL`, "");
  document.getElementById("out").textContent = lines.join("\n");
})();
</script></body></html>
